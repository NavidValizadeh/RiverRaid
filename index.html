<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raid River - Atari Style Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #000;
            font-family: 'Courier New', monospace;
            color: #fff;
            overflow: hidden;
        }
        
        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
            background-color: #000;
            margin-bottom: 20px;
        }
        
        #game-canvas {
            border: 4px solid #30e830;
            box-sizing: content-box;
        }
        
        #score-display {
            font-size: 24px;
            margin-bottom: 10px;
            color: #30e830;
        }
        
        #lives-display {
            font-size: 24px;
            margin-bottom: 20px;
            color: #30e830;
        }
        
        #start-screen, #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 10;
        }
        
        h1 {
            color: #30e830;
            font-size: 48px;
            text-align: center;
            margin-bottom: 40px;
            text-transform: uppercase;
        }
        
        .button {
            background-color: #30e830;
            color: #000;
            border: none;
            padding: 15px 30px;
            font-size: 24px;
            cursor: pointer;
            margin-top: 20px;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            text-transform: uppercase;
        }
        
        .button:hover {
            background-color: #fff;
        }
        
        .instructions {
            text-align: center;
            margin: 20px 40px;
            font-size: 18px;
            color: #ccc;
            max-width: 600px;
        }
        
        #high-score {
            color: #30e830;
            font-size: 24px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div id="score-display">SCORE: 0</div>
    <div id="lives-display">LIVES: 3</div>
    <div id="game-container">
        <canvas id="game-canvas" width="800" height="600"></canvas>
        
        <div id="start-screen">
            <h1>RAID RIVER</h1>
            <div class="instructions">
                <p>Navigate your raft across the dangerous river!</p>
                <p>Avoid obstacles and collect treasures.</p>
                <p>Use ARROW KEYS or W,A,S,D to move.</p>
            </div>
            <button id="start-button" class="button">START GAME</button>
        </div>
        
        <div id="game-over-screen" style="display: none;">
            <h1>GAME OVER</h1>
            <div id="final-score">SCORE: 0</div>
            <div id="high-score">HIGH SCORE: 0</div>
            <button id="restart-button" class="button">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        // Game constants
        const CANVAS_WIDTH = 800;
        const CANVAS_HEIGHT = 600;
        const PLAYER_WIDTH = 50;
        const PLAYER_HEIGHT = 30;
        const OBSTACLE_WIDTH = 60;
        const OBSTACLE_MIN_HEIGHT = 40;
        const OBSTACLE_MAX_HEIGHT = 120;
        const TREASURE_SIZE = 30;
        const RIVER_SPEED = 2;
        const RIVER_ACCELERATION = 0.0005;
        const OBSTACLE_SPAWN_RATE = 0.02;
        const TREASURE_SPAWN_RATE = 0.01;
        
        // Game variables
        let canvas, ctx;
        let player;
        let obstacles = [];
        let treasures = [];
        let score = 0;
        let lives = 3;
        let highScore = 0;
        let gameActive = false;
        let animationId;
        let currentSpeed = RIVER_SPEED;
        let lastFrameTime = 0;
        let keys = {};

        // Sound effects
        const crashSound = new Audio('data:audio/wav;base64,UklGRnQFAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YVAFAACAgICAgICAgICAgICAgICAgICAgICAgICAf3hxeH+AfXZ1eHx6dnR5fYB8dG92zoom5LyUak0EtdB9dHaCgIOMoZCzh9NzW1xTOlY9TUxJSEUmMf+CZaTtBlZJV1hcbZbQ2QIoW+I5xMJ6fnh2dHJzcXBvbm1sa2ppaGdmZWRjYmFgX15dXFtaWVhXVlVUU1JRUE9OTUxLSklIR0ZFRENCQUA/Pj08Ozo5ODc2NTQzMjEwLy4tLCsqKSgnJiUkIyIhIB8eHRwbGhkYFxYVFBMSERAPDg0MCwoJCAcGBQQDAgEAAP//AABERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERERE');
        const treasureSound = new Audio('data:audio/wav;base64,UklGRqQDAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YYQDAAB9fX19fH18fH19fX19fn1+fX19fn1+fX5+fn5+f39/f4CAf4B/gH+AgICAgICAgICAgIGAgYCBgIGAgYCBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYCBgIGAgYCBgICAgICAgICAf4CAf4B/gH+Af39/f39/fn5+fn5+fn19fX19fHx8fHx8e3t7e3t7e3t6enp6enl5eXl5eXh4eHh4d3d3d3d3dnZ2dnZ1dXV1dXV0dHR0dHNzc3NzcnJycnJxcXFxcXFwcHBwcG9vb29vbm5ubm5tbW1tbWxsbGxsa2tra2tqampqamlpaWlpaGhoaGhnZ2dnZ2ZmZmZmZWVlZWVkZGRkZGNjY2NjYmJiYmJhYWFhYWBgYGBgX19fX19eXl5eXl1dXV1dXFxcXFxbW1tbW1paWlpaWVlZWVlYWFhYWFdXV1dXVlZWVlZVVVVVVVRUVFRUU1NTU1NSUlJSUlFRUVFRUFBQUFBPT09PT05OTk5OTU1NTU1MTExMTEtLS0tLSkpKSkpJSUlJSUhISEhIR0dHR0dGRkZGRkVFRUVFREREREVFRUVFRUVFRkZGRkZHR0dHR0hISEhISUlJSUlKSkpKSktLS0tLTExMTExNTU1NTU5OTk5OT09PT09QUFBQUFFRUVFRUlJSUlJTU1NTU1RUVFRUVVVVVVVWVlZWVldXV1dXWFhYWFhZWVlZWVpaWlpaW1tbW1tcXFxcXF1dXV1dXl5eXl5fX19fX2BgYGBgYWFhYWFiYmJiYmNjY2NjZGRkZGRlZWVlZWZmZmZmZ2dnZ2doaGhoaGlpaWlpaWpqampqa2tra2tsbGxsbG1tbW1tbm5ubm5vb29vb3BwcHBwcXFxcXFycnJycnNzc3Nzc3R0dHR0dXV1dXV2dnZ2dnd3d3d3eHh4eHh5eXl5eXp6enp6e3t7e3t8fHx8fH19fX19fn5+fn5/f39/f4CAgICAgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGBgYGAgYCBgIGAgYCAgICAgICAgICAf4B/gH+Af4B/f39/f39+fn5+fn59fX19fXx8fHx8');

        // DOM Elements
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');
        const startButton = document.getElementById('start-button');
        const restartButton = document.getElementById('restart-button');
        const scoreDisplay = document.getElementById('score-display');
        const livesDisplay = document.getElementById('lives-display');
        const finalScoreDisplay = document.getElementById('final-score');
        const highScoreDisplay = document.getElementById('high-score');

        // Initialize canvas
        function init() {
            canvas = document.getElementById('game-canvas');
            ctx = canvas.getContext('2d');
            
            // Check for saved high score
            const savedHighScore = localStorage.getItem('raidRiverHighScore');
            if (savedHighScore) {
                highScore = parseInt(savedHighScore);
                highScoreDisplay.textContent = `HIGH SCORE: ${highScore}`;
            }
            
            // Event listeners
            window.addEventListener('keydown', (e) => {
                keys[e.key] = true;
            });
            
            window.addEventListener('keyup', (e) => {
                keys[e.key] = false;
            });
            
            startButton.addEventListener('click', startGame);
            restartButton.addEventListener('click', startGame);
        }

        // Start new game
        function startGame() {
            // Reset game state
            score = 0;
            lives = 3;
            obstacles = [];
            treasures = [];
            currentSpeed = RIVER_SPEED;
            gameActive = true;
            
            // Create player
            player = {
                x: CANVAS_WIDTH / 2 - PLAYER_WIDTH / 2,
                y: CANVAS_HEIGHT - PLAYER_HEIGHT - 20,
                width: PLAYER_WIDTH,
                height: PLAYER_HEIGHT,
                speed: 5
            };
            
            // Update displays
            updateScoreDisplay();
            updateLivesDisplay();
            
            // Hide start screen
            startScreen.style.display = 'none';
            gameOverScreen.style.display = 'none';
            
            // Start game loop
            if (animationId) {
                cancelAnimationFrame(animationId);
            }
            lastFrameTime = performance.now();
            gameLoop();
        }

        // Main game loop
        function gameLoop(timestamp) {
            // Calculate deltaTime for smooth animation
            const deltaTime = timestamp - lastFrameTime;
            lastFrameTime = timestamp;
            
            // Clear canvas
            ctx.fillStyle = '#000033';
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            
            // Draw river banks
            drawRiverBanks();
            
            // Handle player movement
            handlePlayerMovement();
            
            // Update current speed (gradually increases)
            currentSpeed += RIVER_ACCELERATION * deltaTime;
            
            // Spawn obstacles and treasures
            if (Math.random() < OBSTACLE_SPAWN_RATE) {
                spawnObstacle();
            }
            
            if (Math.random() < TREASURE_SPAWN_RATE) {
                spawnTreasure();
            }
            
            // Update and draw obstacles
            updateObstacles(deltaTime);
            
            // Update and draw treasures
            updateTreasures(deltaTime);
            
            // Draw player
            drawPlayer();
            
            // Check collisions
            checkCollisions();
            
            // Continue the game loop if game is active
            if (gameActive) {
                animationId = requestAnimationFrame(gameLoop);
            }
        }

        // Draw river banks
        function drawRiverBanks() {
            // Left bank
            ctx.fillStyle = '#5B3A29';
            ctx.fillRect(0, 0, 100, CANVAS_HEIGHT);
            
            // Right bank
            ctx.fillRect(CANVAS_WIDTH - 100, 0, 100, CANVAS_HEIGHT);
            
            // Draw some details on the banks
            ctx.fillStyle = '#7D5A41';
            for (let i = 0; i < 10; i++) {
                // Left bank details
                ctx.fillRect(20 + Math.random() * 60, Math.random() * CANVAS_HEIGHT, 20, 10);
                
                // Right bank details
                ctx.fillRect(CANVAS_WIDTH - 80 + Math.random() * 60, Math.random() * CANVAS_HEIGHT, 20, 10);
            }
        }

        // Handle player movement
        function handlePlayerMovement() {
            // Move left
            if ((keys['ArrowLeft'] || keys['a'] || keys['A']) && player.x > 100) {
                player.x -= player.speed;
            }
            
            // Move right
            if ((keys['ArrowRight'] || keys['d'] || keys['D']) && player.x < CANVAS_WIDTH - player.width - 100) {
                player.x += player.speed;
            }
            
            // Move up
            if ((keys['ArrowUp'] || keys['w'] || keys['W']) && player.y > 0) {
                player.y -= player.speed * 0.8;
            }
            
            // Move down
            if ((keys['ArrowDown'] || keys['s'] || keys['S']) && player.y < CANVAS_HEIGHT - player.height) {
                player.y += player.speed * 0.8;
            }
            
            // Keep player within boundaries
            if (player.x < 100) player.x = 100;
            if (player.x > CANVAS_WIDTH - player.width - 100) player.x = CANVAS_WIDTH - player.width - 100;
            if (player.y < 0) player.y = 0;
            if (player.y > CANVAS_HEIGHT - player.height) player.y = CANVAS_HEIGHT - player.height;
        }

        // Spawn a new obstacle
        function spawnObstacle() {
            const height = OBSTACLE_MIN_HEIGHT + Math.random() * (OBSTACLE_MAX_HEIGHT - OBSTACLE_MIN_HEIGHT);
            const x = 100 + Math.random() * (CANVAS_WIDTH - 200 - OBSTACLE_WIDTH);
            
            obstacles.push({
                x: x,
                y: -height,
                width: OBSTACLE_WIDTH,
                height: height,
                type: Math.random() > 0.5 ? 'log' : 'rock'
            });
        }

        // Update and draw obstacles
        function updateObstacles(deltaTime) {
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obstacle = obstacles[i];
                
                // Move obstacle down
                obstacle.y += currentSpeed * (deltaTime / 16);
                
                // Draw obstacle
                if (obstacle.type === 'log') {
                    ctx.fillStyle = '#8B4513';
                    ctx.fillRect(obstacle.x, obstacle.y, obstacle.width, obstacle.height);
                    
                    // Add log details
                    ctx.fillStyle = '#A0522D';
                    ctx.fillRect(obstacle.x + 10, obstacle.y + 5, obstacle.width - 20, 5);
                    ctx.fillRect(obstacle.x + 10, obstacle.y + obstacle.height - 10, obstacle.width - 20, 5);
                } else {
                    // Draw rock
                    ctx.fillStyle = '#808080';
                    ctx.beginPath();
                    ctx.ellipse(obstacle.x + obstacle.width/2, obstacle.y + obstacle.height/2, 
                                obstacle.width/2, obstacle.height/2, 0, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Add rock details
                    ctx.fillStyle = '#A9A9A9';
                    ctx.beginPath();
                    ctx.ellipse(obstacle.x + obstacle.width/2 - 5, obstacle.y + obstacle.height/2 - 5, 
                                obstacle.width/4, obstacle.height/4, 0, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                // Remove obstacle if it's off screen
                if (obstacle.y > CANVAS_HEIGHT) {
                    obstacles.splice(i, 1);
                    
                    // Give points for successfully avoiding obstacle
                    score += 5;
                    updateScoreDisplay();
                }
            }
        }

        // Spawn a new treasure
        function spawnTreasure() {
            const x = 100 + Math.random() * (CANVAS_WIDTH - 200 - TREASURE_SIZE);
            
            treasures.push({
                x: x,
                y: -TREASURE_SIZE,
                width: TREASURE_SIZE,
                height: TREASURE_SIZE
            });
        }

        // Update and draw treasures
        function updateTreasures(deltaTime) {
            for (let i = treasures.length - 1; i >= 0; i--) {
                const treasure = treasures[i];
                
                // Move treasure down
                treasure.y += currentSpeed * (deltaTime / 16);
                
                // Draw treasure
                ctx.fillStyle = '#FFD700';
                ctx.beginPath();
                ctx.arc(treasure.x + treasure.width/2, treasure.y + treasure.height/2, 
                        treasure.width/2, 0, Math.PI * 2);
                ctx.fill();
                
                // Add shine effect
                ctx.fillStyle = '#FFF';
                ctx.beginPath();
                ctx.arc(treasure.x + treasure.width/2 - 5, treasure.y + treasure.height/2 - 5, 
                        treasure.width/6, 0, Math.PI * 2);
                ctx.fill();
                
                // Remove treasure if it's off screen
                if (treasure.y > CANVAS_HEIGHT) {
                    treasures.splice(i, 1);
                }
            }
        }

        // Draw player (raft)
        function drawPlayer() {
            // Draw raft base
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(player.x, player.y, player.width, player.height);
            
            // Draw raft details (logs)
            ctx.fillStyle = '#A0522D';
            for (let i = 0; i < 3; i++) {
                ctx.fillRect(player.x + 5 + i * (player.width - 10) / 3, player.y, 
                            (player.width - 10) / 3 - 5, player.height);
            }
            
            // Draw person on raft
            ctx.fillStyle = '#FFE7BA';
            ctx.beginPath();
            // Head
            ctx.arc(player.x + player.width/2, player.y + player.height/2 - 5, 
                    7, 0, Math.PI * 2);
            ctx.fill();
            
            // Body
            ctx.fillStyle = '#FF6347';
            ctx.fillRect(player.x + player.width/2 - 5, player.y + player.height/2, 
                        10, 12);
        }

        // Check for collisions
        function checkCollisions() {
            // Check obstacle collisions
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obstacle = obstacles[i];
                
                if (checkCollision(player, obstacle)) {
                    // Remove the obstacle
                    obstacles.splice(i, 1);
                    
                    // Lose a life
                    lives--;
                    updateLivesDisplay();
                    
                    // Play crash sound
                    crashSound.play();
                    
                    // Check if game over
                    if (lives <= 0) {
                        gameOver();
                    }
                    
                    // Only handle one collision at a time
                    break;
                }
            }
            
            // Check treasure collisions
            for (let i = treasures.length - 1; i >= 0; i--) {
                const treasure = treasures[i];
                
                if (checkCollision(player, treasure)) {
                    // Remove the treasure
                    treasures.splice(i, 1);
                    
                    // Add points
                    score += 25;
                    updateScoreDisplay();
                    
                    // Play treasure sound
                    treasureSound.play();
                }
            }
        }

        // Helper function to check collision between two rectangles
        function checkCollision(rect1, rect2) {
            // Use a smaller hitbox for the player to make the game more forgiving
            const playerHitbox = {
                x: rect1.x + 10,
                y: rect1.y + 5,
                width: rect1.width - 20,
                height: rect1.height - 10
            };
            
            return (playerHitbox.x < rect2.x + rect2.width &&
                    playerHitbox.x + playerHitbox.width > rect2.x &&
                    playerHitbox.y < rect2.y + rect2.height &&
                    playerHitbox.y + playerHitbox.height > rect2.y);
        }

        // Update score display
        function updateScoreDisplay() {
            scoreDisplay.textContent = `SCORE: ${score}`;
        }

        // Update lives display
        function updateLivesDisplay() {
            livesDisplay.textContent = `LIVES: ${lives}`;
        }

        // Game over
        function gameOver() {
            gameActive = false;
            
            // Check for high score
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('raidRiverHighScore', highScore);
            }
            
            // Show game over screen
            gameOverScreen.style.display = 'flex';
            finalScoreDisplay.textContent = `SCORE: ${score}`;
            highScoreDisplay.textContent = `HIGH SCORE: ${highScore}`;
        }

        // Initialize the game when the page loads
        window.onload = init;
    </script>
</body>
</html>
